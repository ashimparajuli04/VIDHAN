name = "vidhan-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "vidhan"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/schema/drizzle"
migrations_pattern = "../../packages/schema/drizzle/*/migration.sql"

[[vectorize]]
binding = "VECTORIZE"
index_name = "vidhan"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "vidhan-images"

[dev]
# Bind all interfaces so phones/other devices on the LAN can reach the API.
ip = "0.0.0.0"
port = 8787

[vars]
ADMIN_USERNAME = ""
ADMIN_PASSWORD = ""
OPENROUTER_API_KEY = ""
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
CHAT_MODEL = ""
TITLE_MODEL = ""
R2_ACCOUNT_ID = ""
R2_BUCKET_NAME = "vidhan-images"
R2_PUBLIC_BASE_URL = ""
