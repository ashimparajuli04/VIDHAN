name = "vidhan-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "vidhan"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/schema/drizzle"
migrations_pattern = "../../packages/schema/drizzle/*/migration.sql"

[[vectorize]]
binding = "VECTORIZE"
index_name = "vidhan"

[vars]
ADMIN_TOKEN = ""
OPENROUTER_API_KEY = ""
