name = "vidhan-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "vidhan"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/schema/drizzle"
migrations_pattern = "../../packages/schema/drizzle/*/migration.sql"

[[vectorize]]
binding = "VECTORIZE"
index_name = "vidhan"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "vidhan-images"

[vars]
ADMIN_USERNAME = ""
ADMIN_PASSWORD = ""
OPENROUTER_API_KEY = ""
R2_ACCOUNT_ID = ""
R2_BUCKET_NAME = "vidhan-images"
R2_PUBLIC_BASE_URL = ""
